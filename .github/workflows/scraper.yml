name: Job Scraper

on:
  schedule:
    # Every 30 minutes at :07 and :37 UTC, outside midnight–6am Eastern.
    # Minutes avoid :00/:30, when GitHub's scheduler is most delayed.
    # Hours 4-9 UTC = 00:00-05:59 EDT. In winter the window shifts an hour;
    # the quiet-hours step below covers that.
    - cron: '7,37 0-3,10-23 * * *'
  workflow_dispatch:           # Manual trigger from the GitHub UI or API
    inputs:
      mode:
        description: "normal = scrape + notify; init = seed seen_jobs.json for current matches WITHOUT notifying (use after adding sources/channels)"
        type: choice
        default: normal
        options:
          - normal
          - init

concurrency:
  group: job-scraper-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15        # a hung source must not block the next scheduled run
    permissions:
      contents: write          # Required to commit seen_jobs.json back to the repo

    steps:
      - name: Quiet hours check (no runs 12am-6am Eastern)
        id: quiet
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          if [ "$HOUR" -lt 6 ] && [ "${{ github.event.inputs.mode }}" != "init" ]; then
            echo "::notice::Quiet hours (${HOUR}:00 Eastern) — skipping this run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.quiet.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.quiet.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.quiet.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Discover ATS companies
        if: ${{ steps.quiet.outputs.skip != 'true' && vars.RUN_COMPANY_DISCOVERY == 'true' }}
        env:
          DISCOVERY_SOURCE_URLS: ${{ vars.DISCOVERY_SOURCE_URLS }}
          DISCOVERED_COMPANIES_PATH: ${{ vars.DISCOVERED_COMPANIES_PATH }}
        run: python discover_companies.py

      - name: Run scraper
        if: steps.quiet.outputs.skip != 'true'
        env:
          # Built-in channels: set these as repository secrets.
          # (SWE_WEBHOOK_URL / the internship channel was retired 2026-09-04.)
          PM_WEBHOOK_URL: ${{ secrets.PM_WEBHOOK_URL }}
          FULL_TIME_WEBHOOK_URL: ${{ secrets.FULL_TIME_WEBHOOK_URL }}
          # Advanced multi-channel mode: JSON list, or {"channels": [...]}
          # Can add extra channels or override built-in channel names.
          CHANNELS_JSON: ${{ secrets.CHANNELS_JSON }}
          # Single-channel fallback
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Single-channel filtering (optional — falls back to defaults in config.py)
          KEYWORDS: ${{ vars.KEYWORDS }}
          EXCLUDED_KEYWORDS: ${{ vars.EXCLUDED_KEYWORDS }}
          LOCATIONS: ${{ vars.LOCATIONS }}
          MAX_NOTIFICATIONS_PER_RUN: ${{ vars.MAX_NOTIFICATIONS_PER_RUN }}
          RECENT_POSTING_MAX_AGE_HOURS: ${{ vars.RECENT_POSTING_MAX_AGE_HOURS }}
          ATS_CONCURRENCY: ${{ vars.ATS_CONCURRENCY }}
          SEND_NO_NEW_SUMMARY: ${{ vars.SEND_NO_NEW_SUMMARY }}
          INCLUDE_DISCOVERED_COMPANIES: ${{ vars.INCLUDE_DISCOVERED_COMPANIES }}
          INCLUDE_NON_SPONSORING_COMPANIES: ${{ vars.INCLUDE_NON_SPONSORING_COMPANIES }}
          DISCOVERED_COMPANIES_PATH: ${{ vars.DISCOVERED_COMPANIES_PATH }}
          # Source overrides (optional — all have defaults in config.py)
          SIMPLIFY_URLS: ${{ vars.SIMPLIFY_URLS }}
          SPEEDYAPPLY_URLS: ${{ vars.SPEEDYAPPLY_URLS }}
          JOBRIGHT_URLS: ${{ vars.JOBRIGHT_URLS }}
          ZAPPLY_URLS: ${{ vars.ZAPPLY_URLS }}
          JSON_SOURCE_URLS: ${{ vars.JSON_SOURCE_URLS }}
          WORKDAY_TENANTS: ${{ vars.WORKDAY_TENANTS }}
          REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT }}
          # Jev second-pass judge (jev.py). JEV_ENFORCE drops rejected jobs.
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          JEV_ENABLED: ${{ vars.JEV_ENABLED }}
          JEV_RANKING: ${{ vars.JEV_RANKING }}
          JEV_ENFORCE: ${{ vars.JEV_ENFORCE }}
          JEV_MODEL: ${{ vars.JEV_MODEL }}
          JEV_CONCURRENCY: ${{ vars.JEV_CONCURRENCY }}
          JEV_MAX_CALLS_PER_RUN: ${{ vars.JEV_MAX_CALLS_PER_RUN }}
          JEV_RUN_DEADLINE_SECONDS: ${{ vars.JEV_RUN_DEADLINE_SECONDS }}
          JEV_FIT_FLOOR: ${{ vars.JEV_FIT_FLOOR }}
          JEV_MIN_CONFIDENCE: ${{ vars.JEV_MIN_CONFIDENCE }}
          JEV_CLEARANCE_THRESHOLD: ${{ vars.JEV_CLEARANCE_THRESHOLD }}
          JEV_FIT_BUCKET: ${{ vars.JEV_FIT_BUCKET }}
          JEV_PROMOTE: ${{ vars.JEV_PROMOTE }}
          JEV_PROMOTE_MIN_FIT: ${{ vars.JEV_PROMOTE_MIN_FIT }}
          JEV_PROMOTE_MAX_CALLS: ${{ vars.JEV_PROMOTE_MAX_CALLS }}
          # HackerNews (optional — defaults to 500 comments)
          HN_MAX_COMMENTS: ${{ vars.HN_MAX_COMMENTS }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "init" ]; then
            echo "::notice::INIT mode — seeding seen_jobs.json, no Discord notifications"
            python main.py --init
          else
            python main.py
            code=$?
            # Exit 139 is a native segfault (seen once under Jev load). One retry
            # recovers the channel that had not started yet.
            if [ "$code" -eq 139 ]; then
              echo "::warning::Scraper segfaulted (exit 139); retrying once"
              python main.py
              code=$?
            fi
            exit "$code"
          fi

      - name: Commit updated seen_jobs.json
        # Only the default branch may write seen-state. A dispatch from another
        # ref must not push that ref onto main. Checkout is detached, so the
        # update is pushed as HEAD:main rather than a branch name.
        if: steps.quiet.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git add queued_jobs.json || true
          git add discovered_companies.json || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: update seen_jobs [skip ci]"
          ok=0
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              ok=1
              break
            fi
            echo "::warning::seen_jobs push attempt ${attempt} failed; retrying"
            git rebase --abort || true
            sleep "$attempt"
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Failed to push seen_jobs.json after 3 attempts — expect duplicate Discord posts on the next run"
            exit 1
          fi
