name: Job Scraper

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # Every 15 minutes at off-peak minutes
  workflow_dispatch:           # Manual trigger (GitHub UI, or cron-job.org via the REST API)
    inputs:
      mode:
        description: "normal = scrape + notify; init = seed seen_jobs.json for current matches WITHOUT notifying (use after adding sources/channels)"
        type: choice
        default: normal
        options:
          - normal
          - init

concurrency:
  group: job-scraper-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15        # a hung source must not block the next scheduled run
    permissions:
      contents: write          # Required to commit seen_jobs.json back to the repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover ATS companies
        if: ${{ vars.RUN_COMPANY_DISCOVERY == 'true' }}
        env:
          DISCOVERY_SOURCE_URLS: ${{ vars.DISCOVERY_SOURCE_URLS }}
          DISCOVERED_COMPANIES_PATH: ${{ vars.DISCOVERED_COMPANIES_PATH }}
        run: python discover_companies.py

      - name: Run scraper
        env:
          # Built-in channels: set these as repository secrets.
          # (SWE_WEBHOOK_URL / the internship channel was retired 2026-09-04.)
          PM_WEBHOOK_URL: ${{ secrets.PM_WEBHOOK_URL }}
          FULL_TIME_WEBHOOK_URL: ${{ secrets.FULL_TIME_WEBHOOK_URL }}
          # Advanced multi-channel mode: JSON list, or {"channels": [...]}
          # Can add extra channels or override built-in channel names.
          CHANNELS_JSON: ${{ secrets.CHANNELS_JSON }}
          # Single-channel fallback
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Single-channel filtering (optional — falls back to defaults in config.py)
          KEYWORDS: ${{ secrets.KEYWORDS }}
          EXCLUDED_KEYWORDS: ${{ secrets.EXCLUDED_KEYWORDS }}
          LOCATIONS: ${{ secrets.LOCATIONS }}
          MAX_NOTIFICATIONS_PER_RUN: ${{ secrets.MAX_NOTIFICATIONS_PER_RUN }}
          RECENT_POSTING_MAX_AGE_HOURS: ${{ vars.RECENT_POSTING_MAX_AGE_HOURS }}
          ATS_CONCURRENCY: ${{ vars.ATS_CONCURRENCY }}
          SEND_NO_NEW_SUMMARY: ${{ vars.SEND_NO_NEW_SUMMARY }}
          INCLUDE_DISCOVERED_COMPANIES: ${{ vars.INCLUDE_DISCOVERED_COMPANIES }}
          DISCOVERED_COMPANIES_PATH: ${{ vars.DISCOVERED_COMPANIES_PATH }}
          # Source overrides (optional — all have defaults in config.py)
          SIMPLIFY_URLS: ${{ vars.SIMPLIFY_URLS }}
          SPEEDYAPPLY_URLS: ${{ vars.SPEEDYAPPLY_URLS }}
          JOBRIGHT_URLS: ${{ vars.JOBRIGHT_URLS }}
          ZAPPLY_URLS: ${{ vars.ZAPPLY_URLS }}
          JSON_SOURCE_URLS: ${{ vars.JSON_SOURCE_URLS }}
          WORKDAY_TENANTS: ${{ vars.WORKDAY_TENANTS }}
          REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT }}
          # HackerNews (optional — defaults to 500 comments)
          HN_MAX_COMMENTS: ${{ vars.HN_MAX_COMMENTS }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "init" ]; then
            echo "::notice::INIT mode — seeding seen_jobs.json, no Discord notifications"
            python main.py --init
          else
            python main.py
          fi

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git add queued_jobs.json || true
          git add discovered_companies.json || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: update seen_jobs [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
